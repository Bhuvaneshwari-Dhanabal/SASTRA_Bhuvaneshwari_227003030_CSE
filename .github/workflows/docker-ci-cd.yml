
name: AUTOSAR AI Assistant CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Code/dmfrontend
          file: ./Code/dmfrontend/Dockerfile
          push: false
          tags: bhuvaneshwarid48/autosar-ai-frontend:ci-test

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Code/dmbackend
          file: ./Code/dmbackend/Dockerfile
          push: false
          tags: bhuvaneshwarid48/autosar-ai-backend:ci-test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./Code/dmfrontend
          file: ./Code/dmfrontend/Dockerfile
          push: true
          tags: |
            bhuvaneshwarid48/autosar-ai-frontend:latest
            bhuvaneshwarid48/autosar-ai-frontend:sha-${{ github.sha }}

      - name: Push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./Code/dmbackend
          file: ./Code/dmbackend/Dockerfile
          push: true
          tags: |
            bhuvaneshwarid48/autosar-ai-backend:latest
            bhuvaneshwarid48/autosar-ai-backend:sha-${{ github.sha }}
